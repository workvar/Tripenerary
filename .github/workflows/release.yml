name: Release Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  builder-typecheck:
    name: Typecheck builder app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        working-directory: builder
        run: npm ci

      - name: Typecheck
        working-directory: builder
        run: npm run typecheck

  build:
    name: Build Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate
        run: npm run check

      # The committed android/ tree carries Maps key injection, upload signing,
      # splash wiring, and trimmed permissions. Never expo prebuild --clean here.

      - name: Decode upload keystore
        env:
          TRIPENERARY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TRIPENERARY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TRIPENERARY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Missing secret TRIPENERARY_UPLOAD_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$TRIPENERARY_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # versionCode: major*10000 + minor*100 + patch for tags like 1.2.3
          IFS=. read -r MAJ MIN PAT <<EOF
          ${TAG%%-*}
          EOF
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))
          echo "versionName=$TAG" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"

      - name: Preflight release config
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          TRIPENERARY_UPLOAD_STORE_FILE: release.keystore
          TRIPENERARY_UPLOAD_STORE_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_STORE_PASSWORD }}
          TRIPENERARY_UPLOAD_KEY_ALIAS: ${{ secrets.TRIPENERARY_UPLOAD_KEY_ALIAS }}
          TRIPENERARY_UPLOAD_KEY_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_KEY_PASSWORD }}
        run: npm run preflight

      - name: Build release AAB
        working-directory: android
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          TRIPENERARY_UPLOAD_STORE_FILE: release.keystore
          TRIPENERARY_UPLOAD_STORE_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_STORE_PASSWORD }}
          TRIPENERARY_UPLOAD_KEY_ALIAS: ${{ secrets.TRIPENERARY_UPLOAD_KEY_ALIAS }}
          TRIPENERARY_UPLOAD_KEY_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease assembleRelease --no-daemon
          -Ptripenerary.versionCode=${{ steps.ver.outputs.versionCode }}
          -Ptripenerary.versionName=${{ steps.ver.outputs.versionName }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/tripenerary-${GITHUB_REF_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tripenerary-${GITHUB_REF_NAME}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripenerary-play
          path: |
            dist/*.aab
            dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.aab
            dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Play Store upload: `tripenerary-${{ github.ref_name }}.aab`
            Sideload smoke-test: `tripenerary-${{ github.ref_name }}.apk`

            Upload the AAB in Play Console → Production (or a testing track).
            See `docs/RELEASE.md`.
