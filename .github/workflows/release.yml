name: Release Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  builder-typecheck:
    name: Typecheck builder app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        working-directory: builder
        run: npm ci

      - name: Typecheck
        working-directory: builder
        run: npm run typecheck

  build:
  
    name: Build Play Store AAB
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if [[ "$NAME" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Strip pre-release suffix for numeric code (1.2.3-beta → 1.2.3)
          BASE="${NAME%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${BASE}.0.0"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} → versionName=${NAME} versionCode=${CODE}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate
        run: npm run check

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; release will use debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Build release APK and App Bundle
        working-directory: android
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          TRIPENERARY_UPLOAD_STORE_FILE: release.keystore
          TRIPENERARY_UPLOAD_STORE_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_STORE_PASSWORD }}
          TRIPENERARY_UPLOAD_KEY_ALIAS: ${{ secrets.TRIPENERARY_UPLOAD_KEY_ALIAS }}
          TRIPENERARY_UPLOAD_KEY_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Ptripenerary.versionCode=${{ steps.version.outputs.version_code }} \
            -Ptripenerary.versionName=${{ steps.version.outputs.version_name }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/tripenerary-${GITHUB_REF_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tripenerary-${{ steps.version.outputs.version_name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/tripenerary-${{ steps.version.outputs.version_name }}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tripenerary-android
          path: |
            dist/*.apk
            dist/*.aab

      - name: Resolve release notes
        id: notes
        run: |
          NOTES="store/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "use_generated=false" >> "$GITHUB_OUTPUT"
            echo "Using release notes from $NOTES"
          else
            GENERATED="$RUNNER_TEMP/generated-notes.md"
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "See the autogenerated changelog below."
            } > "$GENERATED"
            echo "body_path=$GENERATED" >> "$GITHUB_OUTPUT"
            echo "use_generated=true" >> "$GITHUB_OUTPUT"
            echo "No store/releases/${GITHUB_REF_NAME}.md — will append generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.use_generated == 'true' }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}

  play-store:
    name: Publish to Play Store
    needs: build
    runs-on: ubuntu-latest
    # Skip prerelease tags (v1.0.0-beta). Requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON.
    # Optional vars: PLAY_STORE_TRACK (default internal), PLAY_STORE_ENABLED=false to skip.
    if: ${{ needs.build.outputs.is_prerelease != 'true' && vars.PLAY_STORE_ENABLED != 'false' }}

    steps:
      - name: Checkout (for Play what's new)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tripenerary-android
          path: dist

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tripcompanion.app
          releaseFiles: dist/tripenerary-${{ needs.build.outputs.version_name }}.aab
          track: ${{ vars.PLAY_STORE_TRACK || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          changesNotSentForReview: false
          whatsnewDirectory: store/whatsnew
