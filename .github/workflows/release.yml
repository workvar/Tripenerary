name: Release Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  builder-typecheck:
    name: Typecheck builder app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        working-directory: builder
        run: npm ci

      - name: Typecheck
        working-directory: builder
        run: npm run typecheck

  build:
    name: Build Play Store AAB
    runs-on: ubuntu-latest
    # Environment secrets (keystore, Firebase, Play JSON) live on the Production env.
    environment: ${{ vars.PLAY_STORE_ENVIRONMENT || 'Production' }}

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if [[ "$NAME" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Strip pre-release suffix for numeric code (1.2.3-beta → 1.2.3)
          BASE="${NAME%%-*}"
          # Read at most 3 dotted parts; discard any extras (do not append .0.0 —
          # that made PATCH="3.0.0" for tags like v1.1.3 and broke arithmetic).
          IFS=. read -r MAJOR MINOR PATCH _ <<< "${BASE}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          # Ensure components are integers
          [[ "$MAJOR" =~ ^[0-9]+$ ]] || MAJOR=0
          [[ "$MINOR" =~ ^[0-9]+$ ]] || MINOR=0
          [[ "$PATCH" =~ ^[0-9]+$ ]] || PATCH=0
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} → versionName=${NAME} versionCode=${CODE}"
          if [ -z "$CODE" ] || [ "$CODE" -le 0 ]; then
            echo "::error::Failed to derive a positive versionCode from tag ${TAG}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate
        run: npm run check

      # android/ is committed. Do NOT run `expo prebuild --clean` here: it deletes
      # android/app (keystore + signing.gradle/secrets.gradle) and regenerates a
      # template that signs release builds with the debug key. Maps keys are
      # injected at Gradle time by android/app/secrets.gradle.
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Cannot publish a debug-signed AAB to Play."
            exit 1
          fi
          test -f android/app/signing.gradle
          test -f android/app/secrets.gradle
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          file android/app/release.keystore

      - name: Build release APK and App Bundle
        working-directory: android
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          TRIPENERARY_UPLOAD_STORE_FILE: release.keystore
          TRIPENERARY_UPLOAD_STORE_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_STORE_PASSWORD }}
          TRIPENERARY_UPLOAD_KEY_ALIAS: ${{ secrets.TRIPENERARY_UPLOAD_KEY_ALIAS }}
          TRIPENERARY_UPLOAD_KEY_PASSWORD: ${{ secrets.TRIPENERARY_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          if [ -z "$TRIPENERARY_UPLOAD_STORE_PASSWORD" ] || [ -z "$TRIPENERARY_UPLOAD_KEY_ALIAS" ]; then
            echo "::error::Upload keystore password/alias secrets are missing."
            exit 1
          fi
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Ptripenerary.versionCode=${{ steps.version.outputs.version_code }} \
            -Ptripenerary.versionName=${{ steps.version.outputs.version_name }} \
            -Ptripenerary.requireReleaseSigning=true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/tripenerary-${GITHUB_REF_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tripenerary-${{ steps.version.outputs.version_name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/tripenerary-${{ steps.version.outputs.version_name }}.aab"

      - name: Verify release signing (reject debug)
        run: |
          # Play uploads the AAB only. APKs may be v2/v3-signed without a jarsigner CN=.
          AAB="dist/tripenerary-${{ steps.version.outputs.version_name }}.aab"
          echo "Checking $AAB"
          if [ ! -f "$AAB" ]; then
            echo "::error::Missing artifact $AAB"
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB" > /tmp/jarsigner-out.txt 2>&1 || true
          head -n 40 /tmp/jarsigner-out.txt || true
          if grep -q 'CN=Android Debug' /tmp/jarsigner-out.txt; then
            echo "::error::$AAB is still signed with the Android Debug key. Play will reject it."
            exit 1
          fi
          if ! grep -q 'CN=' /tmp/jarsigner-out.txt; then
            echo "::error::Could not find a signing certificate on $AAB"
            exit 1
          fi
          CN_LINE=$(grep -m1 'CN=' /tmp/jarsigner-out.txt || true)
          echo "OK: $AAB signer → ${CN_LINE}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tripenerary-android
          path: |
            dist/*.apk
            dist/*.aab

      - name: Resolve release notes
        id: notes
        run: |
          NOTES="store/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "use_generated=false" >> "$GITHUB_OUTPUT"
            echo "Using release notes from $NOTES"
          else
            GENERATED="$RUNNER_TEMP/generated-notes.md"
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "See the autogenerated changelog below."
            } > "$GENERATED"
            echo "body_path=$GENERATED" >> "$GITHUB_OUTPUT"
            echo "use_generated=true" >> "$GITHUB_OUTPUT"
            echo "No store/releases/${GITHUB_REF_NAME}.md — will append generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.use_generated == 'true' }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}

  play-store:
    name: Publish to Play Store
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ vars.PLAY_STORE_ENVIRONMENT || 'Production' }}
    # Skip prerelease tags (v1.0.0-beta). Requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON.
    # Optional vars: PLAY_STORE_TRACK (default internal), PLAY_STORE_STATUS (default draft),
    # PLAY_STORE_ENABLED=false to skip. Use draft until the Play Console app is out of draft.
    if: ${{ needs.build.outputs.is_prerelease != 'true' && vars.PLAY_STORE_ENABLED != 'false' }}

    steps:
      - name: Checkout (for Play what's new)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tripenerary-android
          path: dist

      - name: Verify Play service account secret
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty or missing."
            echo "Add the Play Console service account JSON as a Production environment secret, then re-run."
            exit 1
          fi
          python3 <<'PY'
          import json, os, sys
          raw = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Service account JSON is not valid JSON: {e}")
              sys.exit(1)
          email = data.get("client_email")
          project = data.get("project_id")
          if not email:
              print("::error::Service account JSON is missing client_email")
              sys.exit(1)
          print(f"Service account JSON parses OK")
          print(f"client_email={email}")
          print(f"project_id={project}")
          print()
          print("If upload fails with 'The caller does not have permission':")
          print(f"  1. Enable Google Play Android Developer API on GCP project {project}")
          print(f"  2. Play Console → Users and permissions → Invite user: {email}")
          print("  3. App access: com.tripcompanion.app")
          print("  4. App permissions: View app information + Manage testing tracks / releases")
          print("  5. Wait a few minutes, then re-run Publish Play Store AAB for this tag")
          PY

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tripcompanion.app
          releaseFiles: dist/tripenerary-${{ needs.build.outputs.version_name }}.aab
          tracks: ${{ vars.PLAY_STORE_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STORE_STATUS || 'draft' }}
          inAppUpdatePriority: 2
          changesNotSentForReview: true
          whatsNewDirectory: store/whatsnew
