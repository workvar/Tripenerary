// Resolves build-time secrets without ever committing them.
//
// Lookup order per key, first non-empty wins:
//   1. Process environment  (CI, EAS build secrets)
//   2. Gradle property      (gradle.properties, or ~/.gradle/gradle.properties)
//   3. <projectRoot>/.env   (local dev, gitignored)
//
// Everything is resolved eagerly into plain Strings on `ext.tripSecrets`.
// Deliberately no exported closures: a closure living on `ext` gets invoked
// through Gradle's dynamic dispatch, where property resolution depends on
// whichever delegate happens to be in scope at the call site. Plain map lookups
// have no such failure mode.

def SECRET_KEYS = [
    'GOOGLE_MAPS_ANDROID_KEY',
    'TRIPENERARY_UPLOAD_STORE_FILE',
    'TRIPENERARY_UPLOAD_STORE_PASSWORD',
    'TRIPENERARY_UPLOAD_KEY_ALIAS',
    'TRIPENERARY_UPLOAD_KEY_PASSWORD',
]

// --- Parse .env --------------------------------------------------------------
def dotEnv = [:]
def envFile = new File(rootDir.getAbsoluteFile().getParentFile(), '.env')
if (envFile.exists()) {
    envFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#') || !line.contains('=')) {
            return
        }
        def idx = line.indexOf('=')
        def key = line.substring(0, idx).trim()
        def value = line.substring(idx + 1).trim()
        // Strip one layer of matching surrounding quotes.
        if (value.length() > 1) {
            boolean dq = value.startsWith('"') && value.endsWith('"')
            boolean sq = value.startsWith("'") && value.endsWith("'")
            if (dq || sq) {
                value = value.substring(1, value.length() - 1)
            }
        }
        if (!key.isEmpty()) {
            dotEnv.put(key, value)
        }
    }
}

// --- Resolve -----------------------------------------------------------------
def resolved = [:]
for (String key : SECRET_KEYS) {
    String value = System.getenv(key)

    if (value == null || value.isEmpty()) {
        Object fromProperty = project.findProperty(key)
        value = (fromProperty == null) ? null : fromProperty.toString()
    }
    if (value == null || value.isEmpty()) {
        Object fromFile = dotEnv.get(key)
        value = (fromFile == null) ? null : fromFile.toString()
    }

    // Never null. Callers can treat empty as "not configured".
    resolved.put(key, (value == null) ? '' : value)
}

ext.tripSecrets = resolved
